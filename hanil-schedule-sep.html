<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한일 근무표 – 2026년 9월</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 900px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%);
      color: #fff;
      padding: 28px 32px 22px;
    }
    .header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.05em; }
    .header .meta {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      font-size: 0.88rem;
      opacity: 0.9;
    }
    .header .meta span { display: flex; align-items: center; gap: 5px; }
    .header .meta .label { opacity: 0.7; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; }

    .calendar-wrap { padding: 28px 24px; }

    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }
    .day-header {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 0;
      border-radius: 6px;
      color: #555;
    }
    .day-header.sat { color: #2980b9; }
    .day-header.sun { color: #e74c3c; }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day-cell {
      border-radius: 10px;
      padding: 8px 4px 10px;
      text-align: center;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: 1.5px solid transparent;
      transition: transform 0.15s;
    }
    .day-cell:hover { transform: scale(1.04); }
    .day-cell.empty { background: transparent; border-color: transparent; }

    .day-num {
      font-size: 0.78rem;
      font-weight: 700;
      color: #444;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .day-cell.sat .day-num { color: #2980b9; }
    .day-cell.sun .day-num { color: #e74c3c; }

    .shift-badge {
      font-size: 0.88rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.04em;
      width: 100%;
      max-width: 52px;
    }

    .shift-D  { background: #d4edda; color: #155724; }
    .shift-E  { background: #fff3cd; color: #856404; }
    .shift-N  { background: #cfe2ff; color: #0a3278; }
    .shift-OF { background: #f8d7da; color: #721c24; }
    .shift-OH { background: #e2d9f3; color: #3d1a78; }
    .shift-연 { background: #d1ecf1; color: #0c5460; }

    .day-cell.shift-D-bg  { background: #f0fff4; border-color: #c3e6cb; }
    .day-cell.shift-E-bg  { background: #fffdf0; border-color: #ffeeba; }
    .day-cell.shift-N-bg  { background: #f0f5ff; border-color: #b6d4fe; }
    .day-cell.shift-OF-bg { background: #fff5f5; border-color: #f5c6cb; }
    .day-cell.shift-OH-bg { background: #f8f4ff; border-color: #d1bfed; }
    .day-cell.shift-연-bg { background: #f0fcff; border-color: #bee5eb; }

    .summary {
      margin: 0 24px 28px;
      background: #f8fafc;
      border-radius: 14px;
      padding: 18px 22px;
    }
    .summary h2 {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .stat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .legend {
      margin: 0 24px 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #555;
    }
    .legend-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 12px;
    }

    .footer {
      text-align: center;
      font-size: 0.72rem;
      color: #aaa;
      padding: 16px;
      border-top: 1px solid #eee;
    }

    @media (max-width: 600px) {
      .day-cell { min-height: 58px; padding: 5px 2px 8px; }
      .shift-badge { font-size: 0.75rem; padding: 3px 6px; max-width: 42px; }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="header">
    <h1>간호스케줄 — 한일</h1>
    <div class="meta">
      <span><span class="label">근무기간</span> 2026-09-01 ~ 2026-09-30</span>
      <span><span class="label">근무장소</span> 통합중환자실</span>
      <span><span class="label">직급</span> RN &nbsp;|&nbsp; 팀 A</span>
    </div>
  </div>

  <div class="calendar-wrap">
    <div class="day-headers">
      <div class="day-header sun">일</div>
      <div class="day-header">월</div>
      <div class="day-header">화</div>
      <div class="day-header">수</div>
      <div class="day-header">목</div>
      <div class="day-header">금</div>
      <div class="day-header sat">토</div>
    </div>
    <div class="calendar" id="calendar"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-badge shift-D">D</span>주간 Day</div>
    <div class="legend-item"><span class="legend-badge shift-E">E</span>저녁 Evening</div>
    <div class="legend-item"><span class="legend-badge shift-N">N</span>야간 Night</div>
    <div class="legend-item"><span class="legend-badge shift-OF">OF</span>휴무 Off</div>
    <div class="legend-item"><span class="legend-badge shift-OH">OH</span>공휴일 Holiday</div>
    <div class="legend-item"><span class="legend-badge shift-연">연</span>연차 Annual</div>
  </div>

  <div class="summary">
    <h2>근무 요약</h2>
    <div class="stats" id="stats"></div>
  </div>

  <div class="footer">간호스케줄관리 · 출력자: 김강님 · 전체인력: 51</div>
</div>

<script>
  const schedule = [
    { day: 1,  shift: 'D'  },
    { day: 2,  shift: 'N'  },
    { day: 3,  shift: 'N'  },
    { day: 4,  shift: 'OF' },
    { day: 5,  shift: 'OH' },
    { day: 6,  shift: 'D'  },
    { day: 7,  shift: 'D'  },
    { day: 8,  shift: 'D'  },
    { day: 9,  shift: 'OF' },
    { day: 10, shift: 'OH' },
    { day: 11, shift: 'E'  },
    { day: 12, shift: 'E'  },
    { day: 13, shift: 'OF' },
    { day: 14, shift: 'OF' },
    { day: 15, shift: 'D'  },
    { day: 16, shift: 'D'  },
    { day: 17, shift: 'E'  },
    { day: 18, shift: 'E'  },
    { day: 19, shift: '연' },
    { day: 20, shift: 'OF' },
    { day: 21, shift: 'E'  },
    { day: 22, shift: 'E'  },
    { day: 23, shift: 'OF' },
    { day: 24, shift: 'OF' },
    { day: 25, shift: '연' },
    { day: 26, shift: 'E'  },
    { day: 27, shift: 'E'  },
    { day: 28, shift: 'E'  },
    { day: 29, shift: 'E'  },
    { day: 30, shift: 'OF' },
  ];

  // Sep 1 2026 = Tuesday → offset 2 in Sun-first week (Sun=0, Mon=1, Tue=2)
  const startOffset = 2;

  const shiftBg = {
    D: 'shift-D-bg', E: 'shift-E-bg', N: 'shift-N-bg',
    OF: 'shift-OF-bg', OH: 'shift-OH-bg', '연': 'shift-연-bg',
  };

  const calendar = document.getElementById('calendar');

  for (let i = 0; i < startOffset; i++) {
    const empty = document.createElement('div');
    empty.className = 'day-cell empty';
    calendar.appendChild(empty);
  }

  schedule.forEach(({ day, shift }) => {
    const col = (startOffset + day - 1) % 7; // 0=Sun, 6=Sat
    const isSun = col === 0;
    const isSat = col === 6;

    const cell = document.createElement('div');
    cell.className = `day-cell ${shiftBg[shift] || ''} ${isSun ? 'sun' : ''} ${isSat ? 'sat' : ''}`;

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = day;

    const badge = document.createElement('div');
    badge.className = `shift-badge shift-${shift.replace(/[^a-zA-Z0-9가-힣]/g, '')}`;
    badge.textContent = shift;

    cell.appendChild(numEl);
    cell.appendChild(badge);
    calendar.appendChild(cell);
  });

  const counts = {};
  schedule.forEach(({ shift }) => { counts[shift] = (counts[shift] || 0) + 1; });

  const statColors = { D: '#28a745', E: '#ffc107', N: '#0d6efd', OF: '#dc3545', OH: '#6f42c1', '연': '#17a2b8' };
  const statLabels = { D: '주간(D)', E: '저녁(E)', N: '야간(N)', OF: '휴무(OF)', OH: '공휴일(OH)', '연': '연차(연)' };
  const statBg    = { D: '#d4edda', E: '#fff3cd', N: '#cfe2ff', OF: '#f8d7da', OH: '#e2d9f3', '연': '#d1ecf1' };

  const statsEl = document.getElementById('stats');
  Object.entries(counts).forEach(([shift, cnt]) => {
    const item = document.createElement('div');
    item.className = 'stat-item';
    item.style.background = statBg[shift] || '#f0f0f0';
    item.innerHTML = `<span class="stat-dot" style="background:${statColors[shift]||'#888'}"></span>
      <span>${statLabels[shift] || shift}</span>
      <span style="margin-left:4px;font-size:1rem;">${cnt}일</span>`;
    statsEl.appendChild(item);
  });
</script>
</body>
</html>
