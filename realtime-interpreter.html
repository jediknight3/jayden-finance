<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 동시통역</title>
<style>
:root {
  --bg: #0f1117; --surface: #161b27; --card: #1e2436;
  --border: #252d42; --border2: #2e3a56;
  --accent: #5b73ff; --accent2: #a855f7;
  --text: #dde4f8; --dim: #6a7a9e; --muted: #3a4460;
  --green: #22c55e; --red: #f87171; --yellow: #fbbf24;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
  font-size: 14px; overflow: hidden; }

/* ── 앱 뼈대 ── */
.app { height: 100vh; display: flex; flex-direction: column; }

/* ── 상단 셋업 바 ── */
.setup {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap;
}
.brand { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; margin-right: 4px; }
.brand-ico { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); font-size: 15px; }
.setup-tabs { display: flex; gap: 4px; }
.stab { background: var(--card); border: 1px solid var(--border2); border-radius: 6px; padding: 4px 10px;
  font-size: 11px; color: var(--dim); cursor: pointer; transition: all .15s; }
.stab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.setup-input-row { flex: 1; display: flex; gap: 6px; min-width: 0; max-width: 480px; }
input.sinput { flex: 1; background: var(--card); border: 1px solid var(--border2); border-radius: 7px;
  padding: 6px 10px; color: var(--text); font-size: 12px; outline: none; min-width: 0; }
input.sinput:focus { border-color: var(--accent); }
input.sinput::placeholder { color: var(--muted); }
.btn-save { background: var(--accent); color: #fff; border: none; border-radius: 7px;
  padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-save:hover { opacity: .88; }
select.mdl { background: var(--card); border: 1px solid var(--border2); border-radius: 7px;
  padding: 6px 8px; color: var(--text); font-size: 12px; cursor: pointer; outline: none; white-space: nowrap; }
.setup-status { font-size: 11px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.ss-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.ss-dot.ok  { background: var(--green); }
.ss-dot.err { background: var(--red); }

/* ── 툴바 ── */
.toolbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap;
}
.lang-row { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 200px; }
select.lng { flex: 1; background: var(--card); border: 1px solid var(--border2); border-radius: 7px;
  padding: 6px 8px; color: var(--text); font-size: 13px; cursor: pointer; outline: none; }
select.lng:focus { border-color: var(--accent); }
.btn-swap { width: 30px; height: 30px; background: var(--card); border: 1px solid var(--border2);
  border-radius: 50%; color: var(--dim); font-size: 13px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
.btn-swap:hover { border-color: var(--accent); color: var(--accent); }
.vsep { width: 1px; height: 22px; background: var(--border2); flex-shrink: 0; }
.tts-row { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim);
  cursor: pointer; user-select: none; white-space: nowrap; }
.sw { width: 30px; height: 16px; background: var(--card); border: 1px solid var(--border2);
  border-radius: 8px; position: relative; transition: all .2s; }
.sw.on { background: var(--accent); border-color: var(--accent); }
.sw::after { content: ''; position: absolute; width: 10px; height: 10px; background: #fff;
  border-radius: 50%; top: 2px; left: 2px; transition: left .2s; }
.sw.on::after { left: 16px; }
.btn-clr { background: none; border: 1px solid var(--border2); border-radius: 7px;
  padding: 5px 10px; color: var(--muted); font-size: 12px; cursor: pointer; }
.btn-clr:hover { border-color: var(--red); color: var(--red); }
.btn-go { display: flex; align-items: center; gap: 6px; padding: 7px 16px; border: none;
  border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0; transition: all .2s; }
.btn-go.idle { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
  box-shadow: 0 0 16px rgba(91,115,255,.3); }
.btn-go.idle:hover { transform: translateY(-1px); }
.btn-go.live { background: var(--red); color: #fff; animation: pulse-go 2s infinite; }
@keyframes pulse-go { 0%,100%{box-shadow:0 0 10px rgba(248,113,113,.3)} 50%{box-shadow:0 0 22px rgba(248,113,113,.5)} }
.rdot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.btn-go.live .rdot { animation: blink .9s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── 패널 ── */
.panels { flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
.panel { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); }
.panel:last-child { border-right: none; }
.ph { padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.pt { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.pa { display: flex; align-items: center; gap: 7px; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: var(--card); color: var(--dim); border: 1px solid var(--border2); }
.wv { display: flex; align-items: center; gap: 2px; height: 14px; }
.wb { width: 2px; height: 3px; background: var(--accent); border-radius: 1px; opacity: .3; transition: height .1s; }
.btn-ca { font-size: 11px; padding: 2px 8px; background: none; border: 1px solid var(--border2); border-radius: 6px; color: var(--dim); cursor: pointer; }
.btn-ca:hover { border-color: var(--accent); color: var(--accent); }
.pb { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
.pb::-webkit-scrollbar { width: 3px; }
.pb::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── 엔트리 ── */
.entry { background: var(--card); border: 1px solid var(--border2); border-radius: 8px;
  padding: 9px 12px; animation: fadeUp .2s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
.etext { font-size: 15px; line-height: 1.7; word-break: break-word; }
.etext.interim { color: var(--dim); font-style: italic; }
.emeta { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.etime { font-size: 10px; color: var(--muted); }
.ecopy { font-size: 10px; background: none; border: none; color: var(--muted); cursor: pointer; padding: 1px 5px; border-radius: 3px; }
.ecopy:hover { background: var(--surface); color: var(--dim); }
/* 로딩 */
.ldots { display: flex; align-items: center; gap: 6px; padding: 9px 12px; color: var(--dim); font-size: 12px; }
.ld { display: flex; gap: 3px; }
.ld span { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); animation: dp 1.2s infinite; }
.ld span:nth-child(2){animation-delay:.15s} .ld span:nth-child(3){animation-delay:.3s}
@keyframes dp { 0%,80%,100%{transform:scale(.5);opacity:.4} 40%{transform:scale(1);opacity:1} }
/* 빈 상태 */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 8px; color: var(--muted); }
.ei { font-size: 30px; opacity: .28; }
.em { font-size: 12px; text-align: center; line-height: 1.6; }

/* ── 상태바 ── */
.statusbar { height: 30px; background: var(--surface); border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; padding: 0 16px; flex-shrink: 0; }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.sdot.on { background: var(--green); animation: pdot 1.5s infinite; }
@keyframes pdot { 0%,100%{opacity:1} 50%{opacity:.3} }
.smsg { font-size: 11px; color: var(--dim); }
.sstat { margin-left: auto; font-size: 10px; color: var(--muted); }

@media(max-width:680px){
  html,body{overflow:auto}
  .app{height:auto}
  .panels{grid-template-columns:1fr;overflow:visible}
  .panel{min-height:220px;border-right:none;border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>
<div class="app">

<!-- ── 셋업 바 ── -->
<div class="setup">
  <div class="brand"><div class="brand-ico">🌐</div>실시간 동시통역</div>

  <div class="setup-tabs">
    <div class="stab on" id="tabKey" onclick="setTab('key')">API 키</div>
    <div class="stab"    id="tabGas" onclick="setTab('gas')">GAS URL</div>
  </div>

  <div class="setup-input-row">
    <input type="password" class="sinput" id="keyInput" placeholder="sk-ant-api03-…">
    <input type="url"      class="sinput" id="gasInput" placeholder="https://script.google.com/…" style="display:none">
    <button class="btn-save" onclick="saveCfg()">저장</button>
  </div>

  <select class="mdl" id="mdlSel" onchange="savePref()">
    <option value="claude-haiku-4-5-20251001">⚡ Haiku (빠름)</option>
    <option value="claude-sonnet-4-6">✨ Sonnet (정확)</option>
  </select>

  <div class="setup-status">
    <div class="ss-dot" id="cfgDot"></div>
    <span id="cfgMsg">미설정</span>
  </div>
</div>

<!-- ── 툴바 ── -->
<div class="toolbar">
  <div class="lang-row">
    <select class="lng" id="srcSel" onchange="onLang()"></select>
    <button class="btn-swap" onclick="swapLang()" title="언어 교체">⇄</button>
    <select class="lng" id="tgtSel" onchange="onLang()"></select>
  </div>
  <div class="vsep"></div>
  <label class="tts-row" onclick="toggleTTS()"><div class="sw" id="ttsSw"></div>🔊 음성</label>
  <button class="btn-clr" onclick="clearAll()">🗑 지우기</button>
  <button class="btn-go idle" id="goBtn" onclick="toggle()">
    <div class="rdot"></div><span id="goLbl">통역 시작</span>
  </button>
</div>

<!-- ── 패널 ── -->
<div class="panels">
  <div class="panel">
    <div class="ph">
      <span class="pt">원본 음성</span>
      <div class="pa">
        <div class="wv" id="wv">
          <div class="wb"></div><div class="wb"></div><div class="wb"></div>
          <div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div>
        </div>
        <span class="chip" id="srcChip"></span>
      </div>
    </div>
    <div class="pb" id="srcBody">
      <div class="empty" id="srcEmpty">
        <div class="ei">🎙️</div>
        <div class="em">통역 시작을 누르고<br>말씀하세요</div>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="ph">
      <span class="pt">번역 결과</span>
      <div class="pa">
        <button class="btn-ca" onclick="copyAll()">전체 복사</button>
        <span class="chip" id="tgtChip"></span>
      </div>
    </div>
    <div class="pb" id="tgtBody">
      <div class="empty" id="tgtEmpty">
        <div class="ei">🌐</div>
        <div class="em">번역된 내용이<br>여기에 표시됩니다</div>
      </div>
    </div>
  </div>
</div>

<!-- ── 상태바 ── -->
<div class="statusbar">
  <div class="sdot" id="sdot"></div>
  <span class="smsg" id="smsg">위에서 API 키 또는 GAS URL을 입력하고 저장하세요</span>
  <span class="sstat" id="sstat"></span>
</div>

</div>

<script>
'use strict';

/* ──────────────────────────────────────────
   언어 목록
────────────────────────────────────────── */
const LANGS = [
  ['ko-KR','한국어'],['en-US','English (US)'],['en-GB','English (UK)'],
  ['ja-JP','日本語'],['zh-CN','中文 (简体)'],['zh-TW','中文 (繁體)'],
  ['es-ES','Español'],['fr-FR','Français'],['de-DE','Deutsch'],
  ['pt-BR','Português'],['ru-RU','Русский'],['ar-SA','العربية'],
  ['vi-VN','Tiếng Việt'],['th-TH','ภาษาไทย'],['id-ID','Bahasa Indonesia'],
];
const LMAP = Object.fromEntries(LANGS);

/* ──────────────────────────────────────────
   전역 상태
────────────────────────────────────────── */
let cfg = { mode: 'key', key: '', gas: '' };  // API 설정
let live = false;
let ttsOn = false;

let micStream = null;   // AudioContext keep-alive 용 스트림
let audioCtx  = null;
let recog     = null;
let rtTimer   = null;
let interimEl = null;
let waveTimer = null;
let nSrc = 0, nTgt = 0;

/* ──────────────────────────────────────────
   초기화
────────────────────────────────────────── */
(function boot() {
  ['srcSel','tgtSel'].forEach(id => {
    const sel = $id(id);
    LANGS.forEach(([v,t]) => sel.add(new Option(t,v)));
  });

  cfg.mode = ls('mode') || 'key';
  cfg.key  = ls('key')  || '';
  cfg.gas  = ls('gas')  || '';
  ttsOn    = ls('tts')  === '1';

  $id('keyInput').value  = cfg.key;
  $id('gasInput').value  = cfg.gas;
  $id('ttsSw').classList.toggle('on', ttsOn);
  $id('srcSel').value    = ls('src') || 'ko-KR';
  $id('tgtSel').value    = ls('tgt') || 'en-US';
  $id('mdlSel').value    = ls('mdl') || 'claude-haiku-4-5-20251001';

  setTab(cfg.mode, false);
  refreshChips();
  updateCfgStatus();
})();

/* ──────────────────────────────────────────
   탭 전환 (API키 / GAS URL)
────────────────────────────────────────── */
function setTab(mode, save = true) {
  cfg.mode = mode;
  $id('tabKey').classList.toggle('on', mode === 'key');
  $id('tabGas').classList.toggle('on', mode === 'gas');
  $id('keyInput').style.display = mode === 'key' ? '' : 'none';
  $id('gasInput').style.display = mode === 'gas' ? '' : 'none';
  if (save) ls('mode', mode);
}

/* ──────────────────────────────────────────
   설정 저장
────────────────────────────────────────── */
function saveCfg() {
  if (cfg.mode === 'key') {
    cfg.key = $id('keyInput').value.trim();
    if (!cfg.key) { flash('API 키를 입력하세요', 'warn'); return; }
    ls('key', cfg.key);
  } else {
    cfg.gas = $id('gasInput').value.trim();
    if (!cfg.gas) { flash('GAS URL을 입력하세요', 'warn'); return; }
    ls('gas', cfg.gas);
  }
  updateCfgStatus();
  flash('저장 완료 ✓');
}

function updateCfgStatus() {
  const ok = cfg.mode === 'key' ? !!cfg.key : !!cfg.gas;
  const dot = $id('cfgDot');
  dot.className = 'ss-dot ' + (ok ? 'ok' : 'err');
  $id('cfgMsg').textContent = ok
    ? (cfg.mode === 'key' ? 'API 키 설정됨' : 'GAS URL 설정됨')
    : '미설정';
}

function savePref() {
  ls('src', $id('srcSel').value);
  ls('tgt', $id('tgtSel').value);
  ls('mdl', $id('mdlSel').value);
}

/* ──────────────────────────────────────────
   언어 설정
────────────────────────────────────────── */
function onLang() {
  refreshChips();
  savePref();
  if (live) { stopSession(); setTimeout(startSession, 350); }
}

function swapLang() {
  const s = $id('srcSel'), t = $id('tgtSel');
  [s.value, t.value] = [t.value, s.value];
  onLang();
}

function refreshChips() {
  $id('srcChip').textContent = LMAP[$id('srcSel').value] || '';
  $id('tgtChip').textContent = LMAP[$id('tgtSel').value] || '';
}

function toggleTTS() {
  ttsOn = !ttsOn;
  $id('ttsSw').classList.toggle('on', ttsOn);
  ls('tts', ttsOn ? '1' : '0');
}

/* ──────────────────────────────────────────
   세션 시작 / 중지
────────────────────────────────────────── */
function toggle() { live ? stopSession() : startSession(); }

async function startSession() {
  // 사전 체크
  const ready = cfg.mode === 'key' ? !!cfg.key : !!cfg.gas;
  if (!ready) { alert('위 설정 바에서 API 키 또는 GAS URL을 입력하고 저장하세요.'); return; }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Chrome 또는 Edge 브라우저에서만 사용 가능합니다.'); return; }

  // ── AudioContext keep-alive ──────────────────────────
  // getUserMedia 스트림을 무음 AudioContext에 연결해 유지.
  // SpeechRecognition이 재시작돼도 Chrome이 마이크를
  // "이미 사용 중"으로 인식 → 반복 알림 없음.
  if (!micStream) {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
      const src  = audioCtx.createMediaStreamSource(micStream);
      const gain = audioCtx.createGain();
      gain.gain.value = 0;   // 무음 (피드백 없음)
      src.connect(gain);
    } catch (e) {
      // 권한 거부 또는 지원 안 함 → 그냥 계속 (SpeechRecognition이 자체 처리)
      console.warn('AudioContext keep-alive 실패:', e.message);
      micStream = null;
    }
  }

  live = true;
  updateBtn();
  setStatus('🎙 음성 인식 중…', true);
  startWave();
  spawnRecog(SR);
}

function stopSession() {
  live = false;
  clearTimeout(rtTimer);
  if (recog)     { try { recog.stop(); } catch(_){} recog = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx)  { try { audioCtx.close(); } catch(_){} audioCtx = null; }
  updateBtn();
  setStatus('대기 중');
  stopWave();
  removeInterim();
}

/* ──────────────────────────────────────────
   SpeechRecognition
────────────────────────────────────────── */
function spawnRecog(SR) {
  if (!live) return;

  const r = new SR();
  r.lang            = $id('srcSel').value;
  r.continuous      = true;
  r.interimResults  = true;
  r.maxAlternatives = 1;
  recog = r;

  r.onresult = e => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final   += e.results[i][0].transcript;
      else                      interim += e.results[i][0].transcript;
    }
    if (interim) showInterim(interim);
    if (final)   commitFinal(final);
  };

  r.onerror = e => {
    if (e.error === 'not-allowed') {
      stopSession();
      alert('마이크 접근이 거부됐습니다.\n주소창 왼쪽 🔒 → 마이크 허용 후 다시 시도하세요.');
    }
    // no-speech / aborted → onend에서 자동 재시작
  };

  r.onend = () => {
    if (!live) return;
    clearTimeout(rtTimer);
    rtTimer = setTimeout(() => spawnRecog(SR), 200);
  };

  try {
    r.start();
  } catch (e) {
    setStatus('시작 실패: ' + e.message);
    live = false; updateBtn(); stopWave();
  }
}

/* ──────────────────────────────────────────
   텍스트 표시
────────────────────────────────────────── */
function showInterim(text) {
  killEmpty('srcEmpty');
  if (!interimEl) {
    interimEl = div('entry');
    interimEl.innerHTML = '<div class="etext interim" id="itxt"></div>';
    $id('srcBody').appendChild(interimEl);
  }
  $id('itxt').textContent = text;
  $id('srcBody').scrollTop = 9999;
}

function removeInterim() {
  if (interimEl) { interimEl.remove(); interimEl = null; }
}

function commitFinal(text) {
  removeInterim();
  killEmpty('srcEmpty');
  const ts = nowStr();
  $id('srcBody').appendChild(mkEntry(text, ts));
  $id('srcBody').scrollTop = 9999;
  nSrc++;
  refreshStats();
  translate(text, ts);
}

/* ──────────────────────────────────────────
   번역 (Claude API 직접 or GAS 프록시)
────────────────────────────────────────── */
async function translate(text, ts) {
  const tLang = $id('tgtSel').value;
  const tName = LMAP[tLang] || tLang;
  const model = $id('mdlSel').value;
  const body  = $id('tgtBody');

  killEmpty('tgtEmpty');

  const loader = div('ldots');
  loader.innerHTML = '<div class="ld"><span></span><span></span><span></span></div> 번역 중…';
  body.appendChild(loader);
  body.scrollTop = 9999;

  try {
    let translated = '';

    if (cfg.mode === 'key') {
      // ── 직접 API 호출 ──────────────────────────────
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method : 'POST',
        headers: {
          'Content-Type'   : 'application/json',
          'x-api-key'      : cfg.key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model,
          max_tokens: 1024,
          system: `You are a professional simultaneous interpreter. Translate the input into ${tName}. Return ONLY the translated text, nothing else.`,
          messages: [{ role: 'user', content: text }],
        }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error?.message || `HTTP ${res.status}`);
      translated = (json.content?.[0]?.text || '').trim();

    } else {
      // ── GAS 프록시 호출 ────────────────────────────
      const prompt = `다음 텍스트를 ${tName}로 번역해줘. 번역문만 출력하고 다른 말은 하지 마.\n\n${text}`;
      const url = cfg.gas + '?action=ai&prompt=' + encodeURIComponent(prompt);
      const res  = await fetch(url);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'GAS 오류');
      translated = (json.text || '').trim();
    }

    loader.replaceWith(mkEntry(translated, ts));
    body.scrollTop = 9999;
    nTgt++;
    refreshStats();

    if (ttsOn && window.speechSynthesis) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(translated);
      u.lang = tLang;
      speechSynthesis.speak(u);
    }

  } catch (e) {
    const el = div('entry');
    el.innerHTML = `<div class="etext" style="color:var(--red);font-size:12px">⚠ 번역 실패: ${esc(e.message)}</div>`;
    loader.replaceWith(el);
    body.scrollTop = 9999;
    console.error('[번역 오류]', e);
  }
}

/* ──────────────────────────────────────────
   UI 헬퍼
────────────────────────────────────────── */
function mkEntry(text, ts) {
  const el = div('entry');
  el.innerHTML = `
    <div class="etext">${esc(text)}</div>
    <div class="emeta">
      <span class="etime">${ts}</span>
      <button class="ecopy">복사</button>
    </div>`;
  el.querySelector('.ecopy').onclick = () =>
    navigator.clipboard.writeText(text).catch(() => {});
  return el;
}

function clearAll() {
  $id('srcBody').innerHTML =
    '<div class="empty" id="srcEmpty"><div class="ei">🎙️</div><div class="em">통역 시작을 누르고<br>말씀하세요</div></div>';
  $id('tgtBody').innerHTML =
    '<div class="empty" id="tgtEmpty"><div class="ei">🌐</div><div class="em">번역된 내용이<br>여기에 표시됩니다</div></div>';
  interimEl = null; nSrc = nTgt = 0; refreshStats();
}

function copyAll() {
  const t = [...document.querySelectorAll('#tgtBody .etext')].map(e => e.textContent).join('\n\n');
  if (t) navigator.clipboard.writeText(t).then(() => flash('복사 완료 ✓'));
}

function updateBtn() {
  $id('goBtn').className = 'btn-go ' + (live ? 'live' : 'idle');
  $id('goLbl').textContent = live ? '통역 중지' : '통역 시작';
}

function setStatus(msg, on = false) {
  $id('smsg').textContent = msg;
  $id('sdot').className = 'sdot' + (on ? ' on' : '');
}

function flash(msg, type = 'ok') {
  const prev = $id('smsg').textContent;
  const wasOn = $id('sdot').classList.contains('on');
  setStatus((type === 'warn' ? '⚠ ' : '✓ ') + msg);
  setTimeout(() => setStatus(prev, wasOn), 2500);
}

function refreshStats() {
  $id('sstat').textContent = nSrc > 0 ? `발화 ${nSrc} · 번역 ${nTgt}` : '';
}

const WH = [3,7,13,18,13,7,3];
function startWave() {
  stopWave();
  waveTimer = setInterval(() => {
    document.querySelectorAll('.wb').forEach((b,i) => {
      b.style.height = (WH[i]*(.5+Math.random()*.5))+'px';
      b.style.opacity = '1';
    });
  }, 110);
}
function stopWave() {
  if (waveTimer) { clearInterval(waveTimer); waveTimer = null; }
  document.querySelectorAll('.wb').forEach(b => { b.style.height='3px'; b.style.opacity='.3'; });
}

function killEmpty(id) { const e = $id(id); if (e) e.remove(); }
function div(cls)       { const e = document.createElement('div'); e.className = cls; return e; }
function $id(id)        { return document.getElementById(id); }
function nowStr()       { return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function esc(s)         { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ls(k,v)        { if(v===undefined) return localStorage.getItem('rta_'+k); localStorage.setItem('rta_'+k,v); }
</script>
</body>
</html>
